name: Full book budgets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - run: python -m pip install -r requirements.txt
      - run: python run.py course --mode book
      - run: python run.py verify --mode book
      - run: python run.py math all --mode book
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-book-synthetic-results
          path: outputs/book/
          retention-days: 14
