name: Reader checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  practice:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-toolkit.txt
      - run: python run.py doctor
      - run: python run.py course --mode quick
      - run: python run.py verify --mode quick
      - run: python run.py baseline --mode quick
      - run: python run.py foundations --mode quick
      - run: python run.py toolkit --mode quick
      - run: python -m unittest discover -s tests -v
      - run: python run.py math all --mode quick
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-results-${{ matrix.os }}
          path: outputs/
          retention-days: 7
